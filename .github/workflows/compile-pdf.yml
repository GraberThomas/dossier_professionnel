name: Compile dossier PDF

on:
  push:
    branches:
      - tmp/compile-feastverse-pdf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: dossier-professionnel-pdf
          path: main.pdf
          if-no-files-found: error
