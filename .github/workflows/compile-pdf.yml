name: Compile dossier PDF

on:
  push:
    branches:
      - tmp/compile-feastverse-pdf
  pull_request:
    branches:
      - rewrite/feastverse

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload PDF and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-professionnel-pdf
          path: |
            main.pdf
            main.log
          if-no-files-found: warn
