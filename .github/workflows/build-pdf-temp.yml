name: Build dossier PDF (temporary)

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-extra texlive-lang-french texlive-fonts-recommended

      - name: Compile PDF
        id: compile
        continue-on-error: true
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > build.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            biber main >> build.log 2>&1 || true
            makeglossaries main >> build.log 2>&1 || true
            pdflatex -interaction=nonstopmode -halt-on-error main.tex >> build.log 2>&1
            STATUS=$?
          fi
          if [ $STATUS -eq 0 ]; then
            pdflatex -interaction=nonstopmode -halt-on-error main.tex >> build.log 2>&1
            STATUS=$?
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-professionnel-build-log
          path: build.log
          if-no-files-found: error

      - name: Upload PDF
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dossier-professionnel-pdf
          path: main.pdf
          if-no-files-found: error
