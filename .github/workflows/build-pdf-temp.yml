name: Build dossier PDF (temporary)

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-extra texlive-lang-french texlive-fonts-recommended

      - name: Compile PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          biber main || true
          makeglossaries main || true
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: dossier-professionnel-pdf
          path: main.pdf
          if-no-files-found: error
